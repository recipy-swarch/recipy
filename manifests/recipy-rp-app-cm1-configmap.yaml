apiVersion: v1
data:
  entrypoint.sh: |
    #!/bin/sh

    # Copiar directamente el template como archivo de configuración de nginx
    cp /etc/nginx/conf.d/default.conf.template /etc/nginx/conf.d/default.conf

    # Mostrar el archivo final para depuración
    cat /etc/nginx/conf.d/default.conf

    # Ejecutar nginx en primer plano
    exec nginx -g 'daemon off;'
kind: ConfigMap
metadata:
  annotations:
    use-subpath: "true"
  labels:
    io.kompose.service: recipy-rp-app
  name: recipy-rp-app-cm1
